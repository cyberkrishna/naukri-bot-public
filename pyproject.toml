[project]
name = "naukri-bot-public"
version = "0.1.0"
description = "Public multi-user Telegram bot delivering filtered Naukri job alerts"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-telegram-bot[rate-limiter,webhooks]==21.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "apscheduler==3.10.4",
    "playwright==1.48.0",
    "tf-playwright-stealth==1.2.0",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
